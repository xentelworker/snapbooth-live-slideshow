<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SnapBooth Live Slideshow</title>
  <link rel="stylesheet" href="slideshow.css">
</head>
<body>
  <div id="stage">
    <img id="photoA" class="photo active" alt="">
    <img id="photoB" class="photo" alt="">
    <div id="empty" class="empty">Waiting for photos…</div>
    <div id="badge" class="badge">NEW PHOTO</div>
    <div id="overlay" class="overlay">
      <div id="eventTitle" class="title"></div>
      <div id="eventSubtitle" class="subtitle"></div>
    </div>
    <button id="back" class="back">Settings</button>
  </div>
  <script src="slideshow.js"></script>
</body>
</html>
