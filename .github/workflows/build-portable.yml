name: Build Portable Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'ui/**'
      - 'package.json'
      - '.github/workflows/build-portable.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SnapBooth-Live-Slideshow-Portable
          path: dist/*.exe
          if-no-files-found: error
